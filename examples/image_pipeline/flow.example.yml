# Decode-once fan-out: one JPEG decode node feeds every image consumer.
#
#   source ─images─> decode ─frames┬─> grayscale ─gray─> video (mp4)
#                                  └─> brightness (exposure check)
#
# queue_size bounds the worst-case shared-memory backlog per edge and can be
# set at three levels: per input > per node > flow-wide `defaults`
# (built-in default: 256 messages). Raw frames are ~10x larger than JPEG,
# so keep their queues moderate: overflow drops oldest messages, which
# shows up as reduced coverage in report.json.
bag: /path/to/your/rosbag_dir
report: out/report.json

defaults:
  queue_size: 256          # flow-wide default

source:
  batch_rows: 64           # rows per Arrow batch sent per topic
  batch_bytes: 8388608     # 8 MiB

nodes:
  - id: decode
    path: decode_image.py
    inputs:
      images: /camera/color/image_raw/compressed
    outputs: [frames]

  - id: grayscale
    path: grayscale.py
    queue_size: 128        # node-level default (raw frames: keep small)
    inputs:
      frames: decode/frames
    outputs: [gray]

  - id: brightness
    path: brightness.py
    inputs:
      frames:
        node: decode/frames
        queue_size: 128    # per-input override (highest precedence)

  - id: video
    path: video_sink.py
    queue_size: 128
    inputs:
      frames: grayscale/gray
    env:
      OUT_DIR: out
