[workspace]
resolver = "2"
members = [
    "crates/bagflow-source",
    "crates/bagflow-cli",
    "crates/bagflow-node",
    "crates/bagflow-decode",
    "crates/bagflow-decode-cuda",
]

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

[profile.release]
lto = "thin"
